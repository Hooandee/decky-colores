name: Fork Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  build-emulator:
    if: github.repository == 'jl-casella/decky-colores' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: emulator/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run runtime
      - run: npx electron-builder --linux AppImage --arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Colores-Emulator-arm64
          path: emulator/release/Colores-Emulator-*-arm64.AppImage
          if-no-files-found: error

  release:
    if: github.repository == 'jl-casella/decky-colores' && github.ref == 'refs/heads/main'
    needs: build-emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: pip install -r requirements-dev.txt
      - run: ruff check py_modules main.py tests
      - run: python -m pytest -q
      - run: ruff check armada/package/contents/code armada/tests
      - run: python -m unittest discover -s armada/tests -v
      - run: python -m json.tool armada/package/metadata.json >/dev/null
      - run: sh armada/scripts/package_widget.sh

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:i18n
      - run: pnpm test:fe
      - run: pnpm package:plugin

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Colores-Emulator-arm64
          path: release-assets

      - name: Publish release in this fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="decky-colores-v${VERSION}"
          EMULATOR="release-assets/Colores-Emulator-${VERSION}-arm64.AppImage"
          test -f "$EMULATOR"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          NOTES_FILE="$RUNNER_TEMP/decky-colores-release-notes.md"
          cat > "$NOTES_FILE" <<'EOF'
          ## Colores for Decky

          - Fixed audio-reactive lighting with automatic output-device tracking and capture reconnection.
          - Added native ARM64 and FEX support for Ambilight.
          - Added per-zone RGB control for AYN Odin 2 and its joystick and side lights.
          - Added native eight-zone RGB support for AYN Odin 3, including its separate color-channel topology.
          - Added per-zone RGB support for AYN Portal and Thor plus compatible Retroid Pocket models.
          - Added native RGB profiles for KONKR Pocket FIT Elite and 16-zone MANGMI handhelds.
          - Matched Armada OS color correction, gamma, channel ordering, brightness scaling, and safe failure behavior.
          - Added topology-aware Ambilight: shared screen edges on known left/right layouts and safe global sampling otherwise.
          - Improved localized device identification on ARM handhelds.
          - Added the ARM64 Colores Emulator AppImage for testing plugins without physical hardware.

          ## Armada OS Plasma widget

          - Added an installable `Armada-OS.plasmoid` package.
          - Control RGB lighting directly from the Plasma panel.
          - Switch between Eco, Balanced, and Performance profiles.
          - Automatically follows the language configured in Plasma.
          - Includes English, Spanish, German, Italian, and Brazilian Portuguese.

          ## Downloads

          - `Colores.zip`: Decky Loader plugin.
          - `Armada-OS.plasmoid`: Plasma 6 widget.
          - `Colores-Emulator-<version>-arm64.AppImage`: ARM64 emulator.
          EOF
          gh release create "$TAG" Colores.zip Armada-OS.plasmoid "$EMULATOR" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Colores v${VERSION}" \
            --notes-file "$NOTES_FILE"
