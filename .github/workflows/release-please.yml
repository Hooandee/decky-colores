name: release-please

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify multilingual release notes
        run: python3 scripts/changelog_notes.py --check

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

      - name: Apply multilingual release notes
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          python3 scripts/changelog_notes.py --release-body > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG_NAME" --notes-file "$RUNNER_TEMP/notes.md"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ steps.release.outputs.release_created }}
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 20
          cache: pnpm

      - name: Build and package
        if: ${{ steps.release.outputs.release_created }}
        run: |
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm test:i18n
          pnpm test:fe
          pnpm build
          rm -f dist/*.map
          staging=$(mktemp -d)
          mkdir -p "$staging/Colores"
          cp -rL dist main.py plugin.json package.json README.md LICENSE py_modules assets "$staging/Colores"
          (cd "$staging" && zip -r "$GITHUB_WORKSPACE/Colores.zip" Colores)
          unzip -l "$GITHUB_WORKSPACE/Colores.zip"

      - name: Attach plugin zip to release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" Colores.zip --clobber
