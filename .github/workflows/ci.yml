name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      decky: ${{ steps.scope.outputs.decky }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH")
          fi
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude)android/**' ':(exclude)windows/**'; then
            echo "decky=false" >> "$GITHUB_OUTPUT"
          else
            echo "decky=true" >> "$GITHUB_OUTPUT"
          fi

  backend-tests:
    needs: changes
    if: needs.changes.outputs.decky == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check py_modules main.py tests
      - run: python -m pytest -v

  plasma-widget:
    needs: changes
    if: needs.changes.outputs.decky == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: pip install ruff
      - run: ruff check armada/package/contents/code armada/tests
      - run: python -m unittest discover -s armada/tests -v
      - run: python -m json.tool armada/package/metadata.json >/dev/null
      - run: sh -n armada/scripts/package_widget.sh
      - run: sh armada/scripts/package_widget.sh
      - run: test -f Armada-OS.plasmoid

  frontend-build:
    needs: changes
    if: needs.changes.outputs.decky == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check the frontend
        run: pnpm typecheck
      - name: Validate translation content and terminology
        run: pnpm test:i18n
      - name: Run the frontend test suite
        run: pnpm test:fe
      - name: Build and package the plugin
        run: pnpm package:plugin
      - name: Verify build outputs exist
        run: test -f dist/index.js && test -f Colores.zip

  arm64-emulator:
    needs: changes
    if: needs.changes.outputs.decky == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: emulator/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run runtime
      - run: npx electron-builder --linux AppImage --arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Colores-Emulator-arm64
          path: emulator/release/Colores-Emulator-*-arm64.AppImage
          if-no-files-found: error
