name: prerelease

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Build and package prerelease
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BASE="$(node -p "require('./package.json').version")"
          export VERSION="${BASE}-dev.${SHORT_SHA}"
          node -e "const f='package.json';const p=require('./'+f);p.version=process.env.VERSION;require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')"
          echo "Building Colores v${VERSION} from ${BRANCH}"
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm test:i18n
          pnpm test:fe
          pnpm build
          rm -f dist/*.map
          staging=$(mktemp -d)
          mkdir -p "$staging/Colores"
          cp -rL dist main.py plugin.json package.json README.md LICENSE py_modules assets "$staging/Colores"
          (cd "$staging" && zip -r "$GITHUB_WORKSPACE/Colores.zip" Colores)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Colores-${{ env.VERSION }}
          path: Colores.zip
          retention-days: 14
